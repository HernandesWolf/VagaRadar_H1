name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configura o JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Configura Node.js para validar o JavaScript da interface
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verifica sintaxe do frontend
        run: node --check src/main/resources/static/app.js

      - name: Compila e roda todos os testes
        run: mvn -B verify

      - name: Publica o relatório dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
